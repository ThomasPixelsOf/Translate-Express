name: Release

# Pushing a tag such as v1.0.0 builds translate-express-<tag>.zip (the contents of src/) and publishes it as a GitHub release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Check that the tag matches manifest.json
        run: |
          version=$(bun -e 'console.log(require("./src/manifest.json").version)')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi

      - name: Install the test dependencies (happy-dom)
        run: bun install --frozen-lockfile

      - name: Run the tests
        run: bun test

      - name: Build the zip
        run: (cd src && zip -r -q "../translate-express-$GITHUB_REF_NAME.zip" .)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "translate-express-$GITHUB_REF_NAME.zip" \
            --title "Translate Express $GITHUB_REF_NAME" \
            --generate-notes
