name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install jsdom (the page, panel, popup and settings tests need it)
        run: npm install --no-save --no-package-lock jsdom@30.1.3

      - name: Run tests
        run: node --test "tests/*.test.js"
