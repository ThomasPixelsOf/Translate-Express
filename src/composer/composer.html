<!DOCTYPE html>
<html>

<head>
  <title>Translate Express - Message</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="composer.css" />
</head>

<body>
  <header>
    <select id="source" data-ui-aria="composerSourceLanguage"></select>
    <button id="swap" data-ui-title="composerSwapTitle" data-ui-aria="composerSwap">&#8644;</button>
    <select id="target" data-ui-aria="composerTargetLanguage"></select>
    <select id="tone" data-ui-aria="composerTone" hidden>
      <option value="" data-ui="composerSameTone"></option>
      <option value="formal" data-ui="composerFormal"></option>
      <option value="informal" data-ui="composerInformal"></option>
    </select>
    <span id="status" aria-live="polite"></span>
  </header>

  <main>
    <section>
      <textarea id="input" data-ui-placeholder="composerInputPlaceholder" autofocus spellcheck="false"></textarea>
    </section>
    <section>
      <textarea id="output" readonly data-ui-placeholder="composerOutputPlaceholder"></textarea>
    </section>
  </main>

  <footer>
    <button id="copy" class="primary" data-ui="composerCopy"></button>
    <button id="insert" hidden data-ui="composerInsert"></button>
    <button id="clear" data-ui="composerClear"></button>
    <span id="hint" hidden><span data-ui="composerHintBefore"></span><a href="#" id="goKey" data-ui="composerHintLink"></a><span data-ui="composerHintAfter"></span></span>
  </footer>

  <script src="/lib/checkedLastError.js"></script>
  <script src="/lib/stuff.js"></script>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/platformInfo.js"></script>
  <script src="/lib/ui-text.js"></script>
  <script src="/lib/ui/en.js"></script>
  <script src="/lib/ui/fr.js"></script>
  <script src="composer.js"></script>
</body>

</html>
