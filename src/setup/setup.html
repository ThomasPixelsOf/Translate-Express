<!DOCTYPE html>
<html>

<head>
  <title>Translate Express - Settings</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="setup.css" />
</head>

<body>
  <section id="languages-section">
    <h1 data-ui="setupLanguages"></h1>
    <label for="language" data-ui="setupRead"></label>
    <select id="language"></select>
    <label for="writeLanguage" data-ui="setupWrite"></label>
    <select id="writeLanguage"></select>
    <label for="uiLanguage" data-ui="setupInterface"></label>
    <select id="uiLanguage"></select>
  </section>

  <section id="key-section">
  <h1 style="margin-top: 28px;" data-ui="setupKeyTitle"></h1>
  <p data-ui="setupKeyIntro"></p>

  <label for="key" data-ui="setupApiKey"></label>
  <input type="password" id="key" placeholder="gsk_..." autocomplete="off" spellcheck="false" autofocus>

  <details>
    <summary data-ui="setupModel"></summary>
    <select id="model"><option value="" data-ui="setupAutoModel"></option></select>
    <button id="load" type="button" data-ui="setupLoadList"></button>
  </details>

  <div class="buttons">
    <button id="save" class="primary" data-ui="setupSave"></button>
    <button id="remove" data-ui="setupRemove"></button>
  </div>
  </section>
  <p id="status" aria-live="polite"></p>

  <script src="/lib/checkedLastError.js"></script>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/ui-text.js"></script>
  <script src="/lib/ui/en.js"></script>
  <script src="/lib/ui/fr.js"></script>
  <script src="setup.js"></script>
</body>

</html>
