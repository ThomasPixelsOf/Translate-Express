<!DOCTYPE html>
<html>

<head>
  <title>Translate Express - Dashboard</title>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <link rel="stylesheet" href="dashboard.css" />
</head>

<body>
  <header>
    <h1>Translate Express</h1>
    <span class="sub" data-ui="dashboardSubtitle"></span>
    <span class="spacer"></span>
    <button id="refresh" data-ui="dashboardRefresh"></button>
    <button id="copy" data-ui-title="dashboardCopyReportTitle" data-ui="dashboardCopyReport"></button>
    <button id="clear" data-ui-title="dashboardClearTitle" data-ui="dashboardClear"></button>
  </header>
  <nav>
    <button data-tab="summary" class="on" data-ui="dashboardTabSummary"></button>
    <button data-tab="page" data-ui="dashboardTabPage"></button>
    <button data-tab="log" data-ui="dashboardTabLog"></button>
  </nav>
  <main>
    <section id="summary"></section>
    <section id="page" hidden></section>
    <section id="log" hidden>
      <input id="filter" data-ui-placeholder="dashboardFilter" />
      <pre id="events"></pre>
    </section>
  </main>
  <footer id="status"></footer>
  <script src="/lib/languages.js"></script>
  <script src="/lib/config.js"></script>
  <script src="/lib/ui-text.js"></script>
  <script src="/lib/ui/en.js"></script>
  <script src="/lib/ui/fr.js"></script>
  <script src="metrics.js"></script>
  <script src="dashboard.js"></script>
</body>

</html>
